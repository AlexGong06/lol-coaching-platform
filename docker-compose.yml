# Committed so the whole system runs locally with one command, per the design doc's
# Distribution Plan. Not required to run the test suite: any PostgreSQL 16 reachable
# at DATABASE_URL will do, including a native `brew install postgresql@16`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching"]
      interval: 2s
      timeout: 3s
      retries: 20
